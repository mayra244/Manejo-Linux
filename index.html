<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Technology Enrollments</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <header>
        <h1>Enroll in Technology Courses</h1>
    </header>
    <main>
        <form id="enrollment-form">
            <label for="name">Name:</label>
            <input type="text" id="name" name="name" required>

            <label for="email">Email:</label>
            <input type="email" id="email" name="email" required>

            <label for="courses">Select Technology Courses:</label>
            <select id="courses" name="courses" multiple required>
                <option value="web-development">Web Development</option>
                <option value="data-science">Data Science</option>
                <option value="cyber-security">Cyber Security</option>
                <option value="cloud-computing">Cloud Computing</option>
            </select>

            <button type="submit">Enroll</button>
        </form>
    </main>
    <footer>
        <p>&copy; 2023 Technology Enrollments</p>
    </footer>
</body>
</html>
